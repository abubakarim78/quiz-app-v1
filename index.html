<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link href="./index.css" rel="stylesheet" />
  </head>
  <body>
    <div class="main-container">
      <h1 class="title">Test Your Coding Skills</h1>
      <div id="timer" style="display: none;">Display timer here</div>
      <div id="total-time-spent" style="display: none;">Total Time Spent Here</div>
      <div id="question-container">
        <p id="question">
          Questions Loading...
        </p>
        <div id="answer-container">
        </div>
      </div>
      <button id="nextButton" style="display: none">Next</button>
      <div id="result"></div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
